# SearXNG Settings - Hub de Provedores Local (ai-stack)
# Permite buscas anônimas e saída em JSON para Grounding de LLMs e agentes locais.

use_default_settings: true

server:
  # Chave secreta interna (gerada para o ambiente local)
  secret_key: "ai-stack-searxng-local-key-32chars"
  bind_address: "0.0.0.0"
  port: 8080
  image_proxy: false
  # Desabilita limiter interno para requisições de agentes locais
  limiter: false

search:
  safe_search: 0
  autocomplete: ""
  # Habilita explicitamente o formato JSON para APIs de agentes
  formats:
    - html
    - json

# Configurações de motores recomendados para desenvolvimento e investigações técnicas
engines:
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    timeout: 3.0

  - name: brave
    engine: brave
    shortcut: br
    timeout: 3.0

  - name: github
    engine: github
    shortcut: gh
    categories: it
    timeout: 4.0
